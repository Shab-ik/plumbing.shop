<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог</title>
    <link rel="stylesheet" href="css/catalog.css">
    <link rel="stylesheet" href="css/menu.css">

</head>

<body>




    <div class="menu__blok">
        <div class="menu__close"><img src="img/header/menu-close.png" alt="menuclose" class="menu__close__logo"></div>
        <div class="menu__nav">
            <div class="menu__item">
                <div class="menu__item_icon"><img src="img/header/home.svg" alt="home"></div>
                <div class="menu__item_title"><a href="index.html">Главная</a></div>
            </div>
            <div class="menu__item menu__item_open">
                <div class="menu__item_icon"><img src="img/header/catalog.png" alt="catalog"></div>
                <div class="menu__item_title"><a href="catalog.html">Каталог</a></div>
            </div>
            <div class="menu__item">
                <div class="menu__item_icon"><img src="img/header/profile.png" alt="profile"></div>
                <div class="menu__item_title"><a href="#">Профиль</a></div>
            </div>
            <div class="menu__item">
                <div class="menu__item_icon"><img src="img/header/korxina.png" alt="korzina"></div>
                <div class="menu__item_title"><a href="cart.html">Корзина</a></div>
                
            </div>
        </div>
    </div>

    <header>

        <div class="header__flex">
            <div class="header__logo">
                <div class="header__logo__blob"></div>
                <div class="header__logo__text">СантехМаг</div>
            </div>

            <div class="search__blok">
                <div class="search__img__div"><img src="img/header/loupe.png" alt="" class="search__logo"></div>
                <input type="text" placeholder="Поиск" class="search__input">
            </div>

            <div class="nav__flex">
                <nav class="nav">
                    <div class="nav__item">
                        <div class="nav__item_icon"><img src="img/header/home.svg" alt="home"></div>
                        <div class="nav__item_title"><a href="index.html">Главная</a></div>
                    </div>
                    <div class="nav__item nav__item_open">
                        <div class="nav__item_icon"><img src="img/header/catalog.png" alt="catalog"></div>
                        <div class="nav__item_title"><a href="#">Каталог</a></div>
                    </div>
                    <div class="nav__item">
                        <div class="nav__item_icon"><img src="img/header/profile.png" alt="profile"></div>
                        <div class="nav__item_title"><a href="#">Профиль</a></div>
                    </div>
                    <div class="nav__item" id="cart-btn">
                        <div class="nav__item_icon"><img src="img/header/korxina.png" alt="korzina"></div>
                        <div class="nav__item_title"><a href="cart.html">Корзина</a></div>
                    </div>
                </nav>
            </div>
            <div class="header__menu"><img src="img/header/menu.png" alt="menu"></div>
        </div>



    </header>


    <section class="catalog__container">

        <div class="goods">

        </div>
    </section>



    <script src="script/menu.js"></script>
    <script src="script/cart.js"></script>
    <script src="script/products.js"></script>
    <script src="script/catalog.js"></script>
    <script src="script/animations.js"></script>
    <script src="script/search.js"></script>

</body>

</html>
